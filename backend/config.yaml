# TeleOCR 교실 설정 파일
# 이 파일만 고치면 모델 ID, 버전 고정, 장치, 포트를 바꿀 수 있어요.

model:
  # 공식 모델 ID (Hugging Face)
  id: "XingChen-AGI/TeleOCR"
  # 위 ID로 불러오지 못할 때 순서대로 시도할 대체 ID (이관 전 / 옛 이름)
  fallback_ids:
    - "StarDoc-AI/TeleOCR"
    - "StarDoc-AI/NaviDC-OCR"
  # 모델 저장소의 커밋 해시를 적으면 그 버전으로 고정해요.
  # trust_remote_code 로 실행되는 코드가 예고 없이 바뀌는 것을 막아 줍니다.
  # 빈 값("")이면 최신 버전(main)을 사용합니다. 확인된 해시를 적어 두는 것을 권장해요.
  revision: ""
  # 대체 ID 에 적용할 revision (ID별로 커밋 해시가 다르므로 따로 적어요)
  fallback_revisions: {}
  max_new_tokens: 4096

runtime:
  # 사용할 백엔드: "transformers"(실제 모델) 또는 "mock"(개발·테스트용 고정 결과)
  backend: "transformers"
  # 장치: "auto"(CUDA → Apple Silicon(MPS) → CPU 순서로 자동 선택), "cuda", "mps", "cpu"
  device: "auto"
  # MPS/CPU 에서 사용할 자료형: "float32"(기본, 가장 안정적), "bfloat16", "float16"
  # CUDA 에서는 항상 bfloat16 을 사용합니다.
  cpu_mps_dtype: "float32"

server:
  # 보안을 위해 반드시 127.0.0.1(이 컴퓨터 안에서만 접속 가능)로 둡니다.
  host: "127.0.0.1"
  port: 8765
  # 업로드 파일 최대 크기(MB)
  max_upload_mb: 50
  # 업로드 임시 파일을 보관하는 최대 시간(분). 지나면 자동 삭제됩니다.
  upload_ttl_minutes: 60
  # 서버 시작 시 브라우저 자동 열기
  open_browser: true
